<style>
:root{
  --ink:#0e0e0e; --blue:#0055A4; --blue2:#1f6fc9; --red:#EF4135;
  --flag-solid:linear-gradient(90deg,#0055A4 0 33.34%,#ffffff 33.34% 66.67%,#EF4135 66.67%);
  --flag-card:linear-gradient(90deg,#0055A4 0 33.34%,#dfe6f5 33.34% 66.67%,#EF4135 66.67%); --bg:#f3f5fb; --card:#fff;
  --text:#1c2333; --muted:#6b7385; --line:#e3e7f1; --ok:#1e9e5a; --bad:#d6334a; --warn:#e8890c;
  --r:20px; --shadow:0 2px 14px rgba(31,58,147,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Cairo","Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;background:linear-gradient(115deg,#e3edfb 0%,#f6f9ff 32%,#ffffff 50%,#fff6f5 68%,#fde6e3 100%) fixed;color:var(--text);line-height:1.6;min-height:100vh}
button{font:inherit;cursor:pointer;border:0}
button:disabled{opacity:.55;cursor:not-allowed}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:middle}
.i.s{width:16px;height:16px}
.tricolor{height:8px;background:var(--flag-solid)}

/* header */
header{background:var(--ink);border-bottom:1px solid #262626;position:sticky;top:0;z-index:40}
.bar{max-width:1240px;margin:auto;padding:8px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center}
.brand img{height:60px;width:auto;display:block}
nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;padding:9px 15px;border-radius:12px;color:#b4b9c7;font-weight:600;font-size:14px;transition:.2s;display:flex;align-items:center;gap:8px;white-space:nowrap}
nav button:hover{background:rgba(255,255,255,.08);color:#fff}
nav button.on{background:rgba(255,255,255,.15);color:#fff}
.tbtn{background:var(--blue2);color:#fff;padding:9px 18px;border-radius:12px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tbtn.out{background:transparent;color:#ff8a93;border:1px solid #ff8a93}
.tbar{background:#fff7e6;border-bottom:1px solid #ffe2a8;padding:8px 24px;font-size:13px;display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.tbar button{background:#fff;border:1px solid #f0c978;color:#8a5a00;padding:5px 12px;border-radius:9px;font-size:12.5px;font-weight:700}
@media(max-width:820px){nav{order:3;width:100%;flex:none}.brand img{height:52px}}

main{max-width:1240px;margin:auto;padding:30px 24px 80px}

/* hero */
.hero{background:radial-gradient(800px 380px at 15% -10%,rgba(255,255,255,.18),transparent 60%),linear-gradient(135deg,#00265a 0%,#0055A4 58%,#1f6fc9 100%);color:#fff;border-radius:28px;padding:50px 44px;display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center;position:relative;overflow:hidden}
.eyebrow{display:inline-block;background:rgba(255,255,255,.14);padding:5px 14px;border-radius:999px;font-size:13px;font-weight:700;margin-bottom:14px}
.hero h1{font-size:40px;line-height:1.25;font-weight:800;margin-bottom:12px}
.hero h1 em{font-style:normal;color:#ffd166}
.hero p{opacity:.9;max-width:520px;font-size:16px}
.cta{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.cbtn{background:#fff;color:var(--blue);padding:12px 24px;border-radius:14px;font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
.cbtn.ghost{background:rgba(255,255,255,.14);color:#fff}
.words{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;direction:ltr}
.words span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:10px 20px;border-radius:16px;font-weight:700;font-size:20px;backdrop-filter:blur(4px)}
.words span:nth-child(2n){transform:translateY(12px);background:rgba(255,255,255,.24)}
.words span:nth-child(3n){background:rgba(239,65,53,.45)}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding:34px 24px}.hero h1{font-size:30px}.words{display:none}}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-top:22px}
.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;align-items:center;gap:14px;text-align:right;transition:.25s;box-shadow:var(--shadow)}
.tile:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(31,58,147,.12)}
.tile .ib{width:48px;height:48px;border-radius:14px;display:grid;place-items:center}
.tile b{display:block;font-size:22px;line-height:1.1}
.tile span{font-size:13px;color:var(--muted)}
.c-blue{background:#e9eefc;color:var(--blue)}.c-red{background:#fde8ea;color:var(--red)}
.c-purple{background:#efe7ff;color:#7a3cf0}.c-green{background:#e3f7ec;color:var(--ok)}
.c-orange{background:#fff0dc;color:var(--warn)}.c-teal{background:#dff6f6;color:#0c8d94}

h2.st{font-size:22px;margin:38px 0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:800}
h2.st small{font-size:14px;color:var(--muted);font-weight:600}
h2.st .i{color:var(--blue2);margin-left:8px}
.more{background:none;color:var(--blue2);font-weight:700;font-size:14px}

/* upcoming */
.up{display:grid;gap:10px}
.upi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 18px;display:flex;align-items:center;gap:14px}
.upi .ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.upi div.t{flex:1}
.upi b{display:block}
.upi small{color:var(--muted)}
.upi .left{font-weight:800;color:var(--warn);font-size:13px;white-space:nowrap}

/* toolbar */
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
.sbox{flex:1;min-width:210px;position:relative}
.sbox .i{position:absolute;top:50%;right:14px;transform:translateY(-50%);color:var(--muted)}
.sbox input{width:100%;padding:11px 42px 11px 16px;border:1px solid var(--line);border-radius:14px;background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 15px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.add{background:var(--red);color:#fff;padding:11px 20px;border-radius:14px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:18px}
.card{background:var(--flag-card) top/100% 4px no-repeat, var(--card);border-radius:var(--r);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:10px;transition:.25s;box-shadow:var(--shadow)}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(31,58,147,.12)}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center}
.lv{font-size:12px;font-weight:800;padding:3px 11px;border-radius:999px;background:#e9eefc;color:var(--blue);direction:ltr;white-space:nowrap}
.card h3{font-size:17px;line-height:1.4}
.card p{font-size:13.5px;color:var(--muted);flex:1}
.meta{font-size:12px;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:9px;background:var(--bg);color:#4a5268}
.tag.warn{background:#fff0dc;color:#a45d00}.tag.bad{background:#fde8ea;color:var(--bad)}.tag.ok{background:#e3f7ec;color:#157a45}
.acts{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.btn{padding:9px 15px;border-radius:12px;font-size:13px;font-weight:800;background:var(--blue);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:7px}
.btn.sec{background:#e9eefc;color:var(--blue)}
.btn.del{background:#fde8ea;color:var(--bad)}
.btn.ok{background:var(--ok)}
.btn.lg{padding:12px 28px;font-size:15px}
.empty{text-align:center;padding:54px 20px;color:var(--muted);background:#fff;border:2px dashed var(--line);border-radius:var(--r)}
.empty .eic{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;margin:0 auto 14px}
.empty .eic .i{width:32px;height:32px}
.empty h4{color:var(--text);font-size:18px;margin-bottom:4px}
.empty .btn{margin-top:14px}
.errbox{background:#fde8ea;color:var(--bad);padding:14px 18px;border-radius:14px;margin-bottom:18px;font-size:14px}
.setup{max-width:640px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:34px;text-align:center}
.setup code{background:var(--bg);padding:2px 8px;border-radius:6px;direction:ltr;display:inline-block}
.loading{text-align:center;padding:80px 20px;color:var(--muted)}
.spin{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--blue);border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* link card */
.lcard{flex-direction:row;align-items:flex-start;gap:14px;text-decoration:none}
.lcard img{width:44px;height:44px;border-radius:12px;background:var(--bg);padding:6px;flex-shrink:0}
.lcard .b{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.lcard .host{direction:ltr;text-align:right;font-size:12px;color:var(--blue2);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* video */
.vcard{padding:0;overflow:hidden}
.vwrap{aspect-ratio:16/9;background:#000}
.vwrap video,.vwrap iframe{width:100%;height:100%;border:0;display:block}
.vcard .body{padding:16px 20px 20px;display:flex;flex-direction:column;gap:8px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(15,22,45,.6);z-index:100;display:grid;place-items:center;padding:20px;overflow:auto}
.modal{background:var(--flag-card) top/100% 6px no-repeat, #fff;border-radius:24px;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:28px;position:relative;margin:auto}
.modal.wide{max-width:900px}
.modal h3{font-size:21px;margin-bottom:16px;padding-left:40px}
.x{position:absolute;top:16px;left:18px;width:34px;height:34px;border-radius:50%;background:var(--bg);display:grid;place-items:center;z-index:3}
label.f{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
.in{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.in:focus{outline:2px solid #b8c7ff;border-color:var(--blue2)}
textarea.in{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drop{border:2px dashed #b8c4ea;border-radius:14px;padding:20px;text-align:center;background:#f7f9ff;color:var(--muted);font-size:14px;margin-top:10px}
.drop input{margin-top:8px;max-width:100%}
.actions{display:flex;gap:10px;margin-top:22px;justify-content:flex-start;flex-wrap:wrap}
.progress{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:12px;display:none}
.progress i{display:block;height:100%;width:40%;background:var(--blue2);animation:ind 1.1s ease-in-out infinite alternate}
@keyframes ind{from{margin-right:0}to{margin-right:60%}}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.chk{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;font-weight:600}
.chk input{width:18px;height:18px;accent-color:var(--blue2)}
.infobox{background:#f3f6ff;border:1px solid #dbe4ff;border-radius:14px;padding:14px 16px;font-size:14px;margin:12px 0}

/* quiz builder + taking */
.qb{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px;background:#fafbff}
.qb-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.qb .rm{background:#fde8ea;color:var(--bad);padding:4px 12px;border-radius:8px;font-size:12px;font-weight:700}
.opt{display:flex;gap:10px;align-items:center;margin-top:8px}
.opt input[type=radio]{accent-color:var(--ok);width:18px;height:18px;flex-shrink:0}
.opt .in{padding:9px 12px}
.q{border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.q .qt{font-weight:800;margin-bottom:10px}
.ch{display:flex;gap:10px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:12px;margin-top:8px;cursor:pointer;transition:.15s}
.ch:hover{background:#f3f6ff}
.ch input{accent-color:var(--blue);width:17px;height:17px}
.ch.right{background:#e3f7ec;border-color:var(--ok)}
.ch.wrong{background:#fde8ea;border-color:var(--bad)}
.score{text-align:center;padding:24px;border-radius:18px;background:linear-gradient(135deg,#eef2ff,#fff);border:1px solid var(--line);margin-bottom:20px}
.score b{font-size:48px;color:var(--blue);display:block;direction:ltr}
.qhead{position:sticky;top:-28px;background:#fff;margin:-28px -28px 16px;padding:14px 28px;z-index:2;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.qhead h3{margin:0;padding-left:44px;font-size:17px}
.timer{display:flex;align-items:center;gap:8px;background:#e9eefc;color:var(--blue);font-weight:800;padding:7px 14px;border-radius:12px;direction:ltr;font-size:18px}
.timer.warn{background:#fde8ea;color:var(--bad);animation:pl 1s infinite}
@keyframes pl{50%{opacity:.55}}

/* submissions */
.sub{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.sub .h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.sub .ans{background:var(--bg);border-radius:12px;padding:12px;white-space:pre-wrap;font-size:14px;margin:8px 0}
.sub .gr{display:grid;grid-template-columns:110px 1fr auto auto;gap:8px;margin-top:10px;align-items:center}
@media(max-width:640px){.sub .gr{grid-template-columns:1fr 1fr}}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
th{background:var(--bg);font-size:13px}
iframe.pv{width:100%;height:70vh;border:1px solid var(--line);border-radius:12px}
img.pv{max-width:100%;border-radius:12px}
.toast{position:fixed;bottom:24px;right:50%;transform:translateX(50%);background:#1c2333;color:#fff;padding:12px 22px;border-radius:14px;z-index:300;font-weight:700;display:none;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw}
.toast.err{background:var(--bad)}.toast.ok{background:var(--ok)}
/* ---- هوية فرنسية ---- */
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 0 58%,rgba(255,255,255,.07) 58% 76%,rgba(239,65,53,.22) 76% 100%)}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:8px;background:var(--flag-solid)}
nav button.on{background:rgba(255,255,255,.15) var(--flag-solid) bottom/100% 3px no-repeat;color:#fff}
h2.st>span:first-child{position:relative;padding-bottom:12px}
h2.st>span:first-child::after{content:"";position:absolute;right:0;bottom:0;width:72px;height:5px;border-radius:5px;background:var(--flag-solid);box-shadow:0 0 0 1px #d6dff0}
footer{position:relative}
footer::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--flag-solid)}
.tile{background:var(--flag-card) top/100% 3px no-repeat, #fff}
.qhead{border-top:0}
/* ---- المرفقات والمراجعة ---- */
.res{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;background:#fafbff}
.res summary{cursor:pointer;font-weight:700;display:flex;align-items:center;gap:8px}
.res[open] summary{margin-bottom:10px}
.res .acts{margin-top:10px}
.qpic{max-width:100%;max-height:340px;border-radius:12px;margin:6px 0 4px;display:block;border:1px solid var(--line);background:#fff}
.qb input[type=file]{max-width:100%;font-size:13px}
.q.ok{border-color:#bfe6cf}.q.bad{border-color:#f2b8bf;background:#fffafa}
.q .mini{font-size:13px;margin-top:8px;color:var(--muted)}
.only-wrong .q.ok{display:none}
.rvbar{display:flex;gap:8px;margin:6px 0 14px;flex-wrap:wrap}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stats3 div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-size:13px;color:var(--muted)}
.stats3 b{display:block;font-size:22px;color:var(--text)}
.score .verdict{font-weight:800;margin-top:6px}
.jsonbox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.tag.cls{background:#dff6f6;color:#0c6f75}
.who{color:#fff;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;margin-left:10px}
.who .i{color:#8fb0ff}
.stu-row td{vertical-align:middle}
.stu-row select.in{padding:7px 10px;min-width:150px}
.mine-head{flex-direction:row;align-items:center;gap:16px;flex-wrap:wrap}
.mine-head .ib{width:56px;height:56px;border-radius:16px;display:grid;place-items:center}
@media print{
  body *{visibility:hidden}
  #modal,#modal *{visibility:visible}
  #modal .ov{position:absolute;inset:0;background:#fff;padding:0;display:block;overflow:visible}
  #modal .modal{box-shadow:none;max-width:none;max-height:none;overflow:visible;padding:10px}
  .x,.actions,.noprint{display:none!important}
}
footer{background:var(--ink);color:#9aa1b3;text-align:center;font-size:13px;padding:26px}
footer b{color:#fff}
@media(max-width:640px){.row2{grid-template-columns:1fr}.modal{padding:22px 18px}.qhead{margin:-22px -18px 14px;padding:12px 18px;top:-22px}main{padding:22px 16px 70px}}
/* ===== الألعاب ===== */
.gcard{cursor:pointer;text-align:right;font:inherit}.gcard:hover{transform:translateY(-3px)}
.gsnd{font-size:20px;background:#fff;border:1px solid var(--line);border-radius:12px;width:42px;height:38px}
.gsub{color:var(--muted);margin:6px 0 14px;font-weight:700}
.glv{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.glvb{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow);transition:.2s}
.glvb:hover{border-color:var(--blue);transform:translateY(-3px)}.glvb b{font-size:28px;color:var(--blue)}.glvb span{font-weight:700}.glvb small{color:var(--muted);font-size:12px}
.ghead{display:flex;gap:14px;align-items:center;font-weight:800;margin-bottom:10px}.ghead span:first-child{flex:1;color:var(--blue)}
.gbar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:22px}.gbar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--blue2));transition:width .35s}
.gq{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px 22px;margin-bottom:16px;box-shadow:var(--shadow)}.gq small{color:var(--muted);font-weight:700}.gq h3{font-size:24px;line-height:1.6;margin-top:8px}
.gopts,.gtf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gopt{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px;font-size:18px;font-weight:700;text-align:right;min-height:62px;transition:.15s}
.gopt i{font-style:normal;background:var(--bg);color:var(--muted);width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:14px;flex-shrink:0}
.gopt:not(:disabled):hover{border-color:var(--blue);background:#f4f8ff}
.gopt.ok{border-color:var(--ok);background:#e9f8f0}.gopt.bad{border-color:var(--bad);background:#fdecef}.gopt.dim{opacity:.5}
.gfb{margin:16px 0 12px;padding:14px 16px;border-radius:14px;display:flex;flex-direction:column;gap:4px}.gfb.ok{background:#e9f8f0;color:#146c3c}.gfb.bad{background:#fdecef;color:#9b2239}
.gnext{background:var(--blue);color:#fff;border-radius:14px;padding:13px 28px;font-weight:800;font-size:16px}
.gend{text-align:center;background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px 20px;box-shadow:var(--shadow)}
.gstars{font-size:54px;color:#f5b301;letter-spacing:6px}.gstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}
.gstats div{background:var(--bg);border-radius:14px;padding:14px 6px}.gstats b{display:block;font-size:22px;color:var(--blue)}.gstats span{font-size:12px;color:var(--muted)}
.gnb{color:#b9770e;font-weight:800;margin-bottom:12px}.gacts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
@media(max-width:640px){.gopts,.gtf{grid-template-columns:1fr}.glv{grid-template-columns:1fr}.gq h3{font-size:20px}.gstats{grid-template-columns:1fr 1fr}}

</style>

function timeLeft(t){

  if(ms <= 0) return 'انتهى';
  const d = Math.floor(ms/864e5), h = Math.floor(ms%864e5/36e5), m = Math.max(1,Math.floor(ms%36e5/6e4));

}

function safeFetch(input, init){
  init = init ? Object.assign({}, init) : {};
  if(typeof Headers !== 'undefined' && init.headers instanceof Headers){
    const h = {}; init.headers.forEach((v,k)=>{ h[k] = v; }); init.headers = h;

  return fetch(input, init);
}

let toastT;
function toast(msg, type){
  let t = $('#toast');
  if(!t){ t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.className = 'toast ' + (type||''); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(()=>t.style.display='none', 3800);
}
function normUrl(u){
  u = String(u||'').trim(); if(!u) return null;
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try{ const x = new URL(u); return (x.protocol==='http:'||x.protocol==='https:') ? x.href : null; }catch{ return null; }
}
const hostOf = u => { try{ return new URL(u).hostname.replace(/^www\./,''); }catch{ return ''; } };
const errMsg = e => (e && e.message) ? e.message : 'حدث خطأ غير متوقع';
const extOf = n => ((n||'').split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'') || 'bin';

const configured = !SUPABASE_URL.includes('PASTE') && !SUPABASE_KEY.includes('PASTE');
let sb = null;
let state = { tab:'home', level:'all', cat:'all', cls:'all', q:'', teacher:false, me:null, uid:null, loading:true, err:'' };
let items = [], quizzes = [], assignments = [], links = [], classes = [], students = [], counts = { q:{}, a:{} };

/* ---- ملفات المحتوى: عام (media) أو خاص بصف (media_class، مساره يبدأ برقم الصف) ---- */
const PRIV_BUCKET = 'media_class';
const isPrivPath = p => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\//i.test(String(p || ''));
const isStored = p => !!p && !/^(https?:|data:)/i.test(String(p));
let signed = {};
const pubUrl = (path, dl) => {
  if(isPrivPath(path)){
    const u = signed[path];
    return u ? (dl ? u + '&download=' + encodeURIComponent(dl) : u) : '#';
  }
  return sb.storage.from(BUCKET).getPublicUrl(path, dl ? { download: dl } : undefined).data.publicUrl;
};
async function upMedia(file, folder, classId){
  const path = (classId ? classId + '/' : '') + `${folder}/${uid()}.${extOf(file.name)}`;
  const r = await sb.storage.from(classId ? PRIV_BUCKET : BUCKET).upload(path, file, { contentType: file.type || undefined, cacheControl:'3600' });
  if(r.error) throw r.error;
  return path;
}
async function rmMedia(paths){
  const all = (paths || []).filter(isStored);
  const priv = all.filter(isPrivPath), pub = all.filter(p => !isPrivPath(p));
  try{ if(pub.length) await sb.storage.from(BUCKET).remove(pub); }catch{}
  try{ if(priv.length) await sb.storage.from(PRIV_BUCKET).remove(priv); }catch{}
}
async function resolveSigned(){
  const ps = new Set();
  items.forEach(i => { if(isPrivPath(i.file_path)) ps.add(i.file_path); });
  assignments.forEach(a => { if(isPrivPath(a.attach_path)) ps.add(a.attach_path); });
  quizzes.forEach(z => {
    if(isPrivPath(z.attach_path)) ps.add(z.attach_path);
    (z.questions || []).forEach(q => { if(isPrivPath(q.img)) ps.add(q.img); });
  });
  if(!ps.size) return;
  try{
    const r = await sb.storage.from(PRIV_BUCKET).createSignedUrls([...ps], 7200);
    (r.data || []).forEach(x => { if(x.signedUrl) signed[x.path] = x.signedUrl; });
  }catch{}
}
const legacyTag = (cls, path) => (state.teacher && cls && path && isStored(path) && !isPrivPath(path)) ? `<span class="tag bad" title="هذا الملف مخزّن في مكان عام. احذف العنصر وأعد رفعه ليصبح خاصاً بالصف">⚠ ملف عام: أعد رفعه</span>` : '';

/* ============ تحميل البيانات ============ */
async function refreshCounts(){
  counts = { q:{}, a:{} };
  if(!state.teacher) return;
  const [r, s] = await Promise.all([ sb.from('results').select('quiz_id'), sb.from('submissions').select('assignment_id') ]);
  (r.data||[]).forEach(x => counts.q[x.quiz_id] = (counts.q[x.quiz_id]||0)+1);
  (s.data||[]).forEach(x => counts.a[x.assignment_id] = (counts.a[x.assignment_id]||0)+1);
}
async function loadAll(){
  state.loading = true; render();
  const o = { ascending:false };
  const [a,b,c,d,e,f] = await Promise.all([
    sb.from('items').select('*').order('created_at',o),
    sb.from('quizzes').select('*').order('created_at',o),
    sb.from('assignments').select('*').order('created_at',o),
    sb.from('links').select('*').order('created_at',o),
    sb.from('classes').select('*').order('created_at',{ascending:true}),
    state.teacher ? sb.from('profiles').select('*').order('created_at',o) : Promise.resolve({ data:[] })
  ]);
  const bad = [a,b,c,d,e,f].find(x=>x.error);
  state.err = bad ? 'تعذر تحميل البيانات: ' + errMsg(bad.error) + (/relation|does not exist|schema cache/i.test(errMsg(bad.error)) ? ' — تأكد من تشغيل سكربت التحديث (v2 ثم v3) في Supabase.' : '') : '';
  items = a.data||[]; quizzes = b.data||[]; assignments = c.data||[]; links = d.data||[];
  classes = e.data||[]; students = f.data||[];
  await refreshCounts();
  await resolveSigned();
  state.loading = false; render();
}

function renderShell(){
  const tabs = TABS.slice();
  if(state.teacher) tabs.push(['people','users','الصفوف والطلاب']);
  else if(state.me && state.me.student) tabs.push(['mine','list','نتائجي']);

    ? `<button class="tbtn out" data-a="logout">${I('logout','s')} خروج</button>`

const match = it => (state.cls==='all' || (state.cls==='none' ? !it.class_id : it.class_id===state.cls)) && (state.level==='all' || it.level===state.level || it.level==='all') &&
  (!state.q || ((it.title||'')+' '+(it.description||'')).toLowerCase().includes(state.q.toLowerCase()));

function emptyBox(ic, color, title, text, btn){
  return `<div class="empty"><div class="eic ${color}">${I(ic)}</div><h4>${title}</h4><div>${text}</div>${btn||''}</div>`;
}
const addHint = (label, action) => state.teacher ? `<br><button class="btn" data-a="${action}">${I('plus','s')} ${label}</button>` : '';

/* ---------- بطاقات ---------- */
function icoFor(it){
  const n = (it.file_name||'').toLowerCase();
  if(it.kind==='file' && it.url){
    const ty = (embedInfo(it.url) || {}).type;
    if(ty==='youtube') return ['c-purple','video'];
    if(ty==='image') return ['c-teal','eye'];
    if(ty==='pdf') return ['c-red','file'];
    if(ty==='drive') return ['c-blue','file'];
    return ['c-teal','link'];
  }
  if(it.kind==='video') return ['c-purple','video'];
  if(n.endsWith('.pdf')) return ['c-red','file'];
  if(/\.(png|jpe?g|gif|webp)$/.test(n)) return ['c-teal','eye'];
  if(/\.(mp3|wav|m4a|ogg)$/.test(n)) return ['c-orange','play'];
  return ['c-blue','file'];
}
function fileCard(it){
  const [c,ic] = icoFor(it);
  const canPrev = /\.(pdf|png|jpe?g|gif|webp|mp3|wav|m4a|ogg)$/i.test(it.file_name||'');
  return `<div class="card">
    <div class="top"><div class="ico ${c}">${I(ic)}</div><span class="lv">${esc(it.level)}</span></div>
    <h3 dir="auto">${esc(it.title)}</h3>
    <p>${esc(it.description||'')}</p>
    <div class="tags"><span class="tag">${esc(it.cat||'ملف')}</span>${clsTag(it)}${legacyTag(it.class_id, it.file_path)}${it.size?`<span class="tag">${fmtSize(it.size)}</span>`:`<span class="tag">${I('link','s')} رابط</span>`}<span class="tag">${fmtDate(it.created_at)}</span></div>
    <div class="acts">
      ${canPrev?`<button class="btn" data-a="preview" data-id="${it.id}">${I('eye','s')} عرض</button>`:''}
      ${it.file_path?`<a class="btn sec" href="${esc(pubUrl(it.file_path, it.file_name))}">${I('download','s')} تحميل</a>`:''}
      ${it.url?`<button class="btn" data-a="preview" data-id="${it.id}">${I('eye','s')} عرض</button><a class="btn sec" href="${esc(safeHref(it.url))}" target="_blank" rel="noopener noreferrer">${I('ext','s')} فتح الرابط</a>`:''}
      ${state.teacher?`<button class="btn del" data-a="delItem" data-id="${it.id}">${I('trash','s')} حذف</button>`:''}
    </div></div>`;
}
function ytEmbed(u){
  const m = String(u).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
  return m ? `https://www.youtube.com/embed/${m[1]}` : null;
}
function videoCard(it){
  let player;
  if(it.url){
    const inf = embedInfo(it.url);
    player = (inf && (inf.type==='youtube' || inf.type==='drive')) ? `<iframe src="${esc(inf.embed)}" allowfullscreen loading="lazy" allow="autoplay; fullscreen"></iframe>`
      : (inf && inf.type==='video') ? `<video controls preload="metadata" src="${esc(it.url)}"></video>`
      : `<div style="display:grid;place-items:center;height:100%"><a class="btn" href="${esc(safeHref(it.url))}" target="_blank" rel="noopener noreferrer">${I('ext','s')} فتح الفيديو</a></div>`;
  } else player = `<video controls preload="metadata" src="${esc(pubUrl(it.file_path))}"></video>`;
  return `<div class="card vcard">
    <div class="vwrap">${player}</div>
    <div class="body">
      <div class="top"><h3 dir="auto">${esc(it.title)}</h3><span class="lv">${esc(it.level)}</span></div>
      <p style="font-size:13.5px;color:var(--muted)">${esc(it.description||'')}</p>
      <div class="tags">${clsTag(it)}${legacyTag(it.class_id, it.file_path)}<span class="tag">${fmtDate(it.created_at)}</span>${it.size?`<span class="tag">${fmtSize(it.size)}</span>`:''}</div>
      ${state.teacher?`<div class="acts"><button class="btn del" data-a="delItem" data-id="${it.id}">${I('trash','s')} حذف</button></div>`:''}
    </div></div>`;
}

function assignCard(a){

/* ---------- الصفحات ---------- */
function upcoming(){
  const now = new Date(), arr = [];
  assignments.forEach(a => { if(a.due_at && new Date(a.due_at) > now) arr.push({ t:'assign', title:a.title, at:a.due_at, tab:'assignments' }); });
  quizzes.forEach(z => { if(z.closes_at && new Date(z.closes_at) > now) arr.push({ t:'quiz', title:z.title, at:z.closes_at, tab:'quizzes' }); });
  return arr.sort((a,b)=>new Date(a.at)-new Date(b.at)).slice(0,5);
}

}
function closeModal(){ $('#modal').innerHTML = ''; }
let qs = null; // حالة الاختبار الجاري
function stopTimer(){ if(qs && qs.iv){ clearInterval(qs.iv); qs.iv = null; } }
function requestClose(){
  if(qs && qs.active && !qs.sub){
    if(!confirm('سيُلغى الاختبار ولن تُحفظ إجاباتك. هل تريد الخروج؟')) return;
  }
  stopTimer(); if(qs) qs.active = false;
  closeModal();
}

async function saveQuiz(){
  const title = $('#z_title').value.trim();
  if(!title){ toast('اكتب عنوان الاختبار','err'); return; }
  const qsx = [];
  for(const b of document.querySelectorAll('#qlist .qb')){
    const q = b.querySelector('.qtxt').value.trim();
    const radios = [...b.querySelectorAll('input[type=radio]')];
    const texts = [...b.querySelectorAll('.otxt')].map(i=>i.value.trim());
    const correctRaw = radios.findIndex(r=>r.checked);
    const imgFile = b.querySelector('.qimg').files[0] || null;
    const imgRaw = b.querySelector('.qimgurl').value.trim();
    const explain = b.querySelector('.qexp').value.trim();
    if(!q && texts.every(t=>!t) && !imgFile && !imgRaw) continue;
    if(!q){ toast('يوجد سؤال بدون نص','err'); return; }
    if(!texts[correctRaw]){ toast('الإجابة الصحيحة فارغة في السؤال: '+q,'err'); return; }
    const options = [], map = {};
    texts.forEach((t,i)=>{ if(t){ map[i]=options.length; options.push(t); } });
    if(options.length<2){ toast('كل سؤال يحتاج خيارين على الأقل: '+q,'err'); return; }
    let imgUrl = '';
    if(imgRaw){
      imgUrl = imgRaw.startsWith('data:image/') ? imgRaw : normUrl(imgRaw);
      if(!imgUrl){ toast('رابط الصورة غير صحيح في السؤال: '+q,'err'); return; }
    }
    qsx.push({ q, options, correct: map[correctRaw], explain, imgFile, imgUrl });
  }
  if(!qsx.length){ toast('أضف سؤالاً واحداً على الأقل','err'); return; }
  const attFile = $('#z_att').files[0] || null;
  const extRaw = $('#z_ext').value.trim(); const ext = extRaw ? normUrl(extRaw) : null;
  if(extRaw && !ext){ toast('رابط المرفق غير صحيح','err'); return; }
  const t = parseInt($('#z_time').value,10), cl = $('#z_close').value;
  const btn = $('#savebtn'); btn.disabled = true; btn.textContent = 'جارٍ الحفظ...';
  const uploaded = [];
  try{
    const zcls = $('#z_cls').value || null;
    const up = async (file, folder) => {
      const p = await upMedia(file, folder, zcls);
      uploaded.push(p); return p;
    };
    const questions = [];
    for(const x of qsx){
      let img = x.imgUrl;
      if(x.imgFile) img = await up(x.imgFile, 'qimg');
      const o = { q:x.q, options:x.options }; if(img) o.img = img;
      questions.push(o);
    }
    let attach_path = null, attach_name = null;
    if(attFile){ attach_path = await up(attFile, 'quiz'); attach_name = attFile.name; }
    const ins = await sb.from('quizzes').insert({
      title, level:$('#z_level').value, description:$('#z_desc').value.trim() || null,
      class_id: $('#z_cls').value || null, time_limit_min: t>0 ? t : null, closes_at: cl ? new Date(cl).toISOString() : null,
      attach_path, attach_name, ext_url: ext, questions
    }).select().single();
    if(ins.error) throw ins.error;
    const key = await sb.from('quiz_keys').insert({ quiz_id: ins.data.id, answers: qsx.map(x=>x.correct), explanations: qsx.map(x=>x.explain || '') });
    if(key.error){ await sb.from('quizzes').delete().eq('id', ins.data.id); throw key.error; }
    quizzes.unshift(ins.data); closeModal(); render(); toast('تم حفظ الاختبار','ok');
  }catch(err){
    if(uploaded.length) await rmMedia(uploaded);
    toast('تعذر حفظ الاختبار: ' + errMsg(err) + (/explanations|attach_path|ext_url/i.test(errMsg(err)) ? ' — شغّل سكربت التحديث v4 في Supabase' : ''),'err');
    btn.disabled = false; btn.textContent = 'حفظ الاختبار';
  }
}

async function startQuiz(id){
  const z = quizzes.find(x=>x.id===id);
  const name = $('#stu').value.trim();
  if(!name){ toast('اكتب اسمك أولاً','err'); $('#stu').focus(); return; }
  let rem = null;
  if(z.time_limit_min){
    const sbtn = document.querySelector('[data-a=startQuiz]'); if(sbtn) sbtn.disabled = true;
    const r = await sb.rpc('start_quiz', { p_quiz:id });
    if(r.error){
      if(sbtn) sbtn.disabled = false;
      const m = errMsg(r.error);
      toast(submitErr(m) || (/closed/i.test(m) ? 'هذا الاختبار مغلق' : 'تعذر بدء الاختبار: ' + m), 'err'); return;
    }
    rem = r.data && typeof r.data.remaining_seconds === 'number' ? r.data.remaining_seconds : null;
  }
  qs.name = name; qs.active = true;
  openModal(`
    <div class="qhead"><h3 dir="auto">${esc(z.title)}</h3>${z.time_limit_min?`<div class="timer" id="timerbox">${I('clock','s')}<span id="tm">--:--</span></div>`:''}</div>
    ${resBlock(z)}
    ${z.questions.map((q,i)=>`<div class="q"><div class="qt" dir="auto">${i+1}. ${esc(q.q)}</div>${q.img?`<img class="qpic" src="${esc(imgSrc(q.img))}" alt="">`:''}
      ${q.options.map((o,j)=>`<label class="ch"><input type="radio" name="q${i}" value="${j}"><span dir="auto">${esc(o)}</span></label>`).join('')}</div>`).join('')}
    <div class="actions"><button class="btn ok lg" id="subbtn" data-a="submitQuiz" data-id="${id}">${I('send','s')} تسليم الإجابات</button></div>`, true);
  if(z.time_limit_min){
    qs.end = Date.now() + (rem != null ? rem*1000 : z.time_limit_min*60000);
    const tick = () => {
      const el = $('#tm');
      if(!el){ stopTimer(); return; }
      const ms = qs.end - Date.now();
      if(ms <= 0){ stopTimer(); qs.auto = true; submitQuiz(id); return; }
      const s = Math.ceil(ms/1000);
      el.textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
      $('#timerbox').classList.toggle('warn', s <= 60);
    };
    tick(); qs.iv = setInterval(tick, 500);
  }
}
async function submitQuiz(id){
  if(!qs || qs.sub) return;
  const z = quizzes.find(x=>x.id===id);
  qs.sub = true; stopTimer();
  const answers = z.questions.map((q,i)=>{ const r = document.querySelector(`input[name=q${i}]:checked`); return r ? +r.value : -1; });
  const btn = $('#subbtn'); if(btn) btn.disabled = true;
  const { data, error } = await sb.rpc('submit_quiz', { p_quiz:id, p_student:qs.name, p_answers:answers });
  if(error){
    qs.sub = false;
    toast(/closed/i.test(errMsg(error)) ? 'أُغلق هذا الاختبار ولم يعد يقبل التسليم' : (submitErr(errMsg(error)) || 'تعذر تسليم الاختبار: ' + errMsg(error)), 'err');
    if(btn) btn.disabled = false; return;
  }
  qs.active = false;
  const { score, total, answers: correct, explanations } = data;
  const ex = Array.isArray(explanations) ? explanations : [];
  const pct = Math.round(score/total*100);
  const wrongN = answers.filter((a,i)=>a!==-1 && a!==correct[i]).length;
  const skipN = answers.filter(a=>a===-1).length;
  const bad = total - score;
  const verdict = pct>=90 ? 'ممتاز! Excellent' : pct>=75 ? 'جيد جداً! Très bien' : pct>=50 ? 'ناجح — واصل التدريب' : 'تحتاج إلى مراجعة، حاول مرة أخرى';
  const rows = z.questions.map((q,i) => {
    const my = answers[i], ok = my === correct[i];
    return `<div class="q ${ok?'ok':'bad'}"><div class="qt" dir="auto">${ok?'✔':'✘'} ${i+1}. ${esc(q.q)}</div>
      ${q.img?`<img class="qpic" src="${esc(imgSrc(q.img))}" alt="">`:''}
      ${q.options.map((o,j)=>`<div class="ch ${j===correct[i]?'right':(j===my?'wrong':'')}"><span dir="auto">${j===correct[i]?'✔ ':(j===my?'✘ ':'')}${esc(o)}</span></div>`).join('')}
      ${ok ? '' : `<div class="mini">${my===-1 ? 'لم تُجب على هذا السؤال' : `إجابتك: <b dir="auto">${esc(q.options[my])}</b>`} — الصحيحة: <b dir="auto">${esc(q.options[correct[i]])}</b></div>`}
      ${ex[i] ? `<div class="infobox" dir="auto">${I('sparkle','s')} ${esc(ex[i])}</div>` : ''}</div>`;
  }).join('');
  openModal(`
    <h3>نتيجتك</h3>
    ${qs.auto?`<div class="infobox">${I('clock','s')} انتهى الوقت وتم تسليم إجاباتك تلقائياً.</div>`:''}
    <div class="score"><b style="color:${pct>=50?'var(--ok)':'var(--bad)'}">${score} / ${total}</b>${pct}%<div class="verdict">${verdict}</div>
      <div class="stats3"><div><b style="color:var(--ok)">${score}</b>صحيحة</div><div><b style="color:var(--bad)">${wrongN}</b>خاطئة</div><div><b>${skipN}</b>بلا إجابة</div></div></div>
    ${bad ? `<div class="rvbar"><button class="chip on" data-a="rvWrong">الأخطاء فقط (${bad})</button><button class="chip" data-a="rvAll">كل الأسئلة</button></div>` : `<div class="infobox">${I('check','s')} إجاباتك كلها صحيحة. أحسنت!</div>`}
    <div id="rv" class="${bad?'only-wrong':''}">${rows}</div>
    <div class="actions"><button class="btn lg" data-a="close">إغلاق</button></div>`, true);

}

function preview(id){

/* ============ الروابط والمرفقات والاستيراد ============ */
function embedInfo(u){
  u = String(u || '').trim(); if(!u) return null;
  let m;
  if((m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/)))
    return { type:'youtube', embed:'https://www.youtube.com/embed/' + m[1], url:u };
  if((m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/)) || (m = u.match(/drive\.google\.com\/(?:open|uc)\?(?:.*&)?id=([\w-]+)/)))
    return { type:'drive', embed:'https://drive.google.com/file/d/' + m[1] + '/preview', thumb:'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1200', url:u };
  if((m = u.match(/docs\.google\.com\/(document|presentation|spreadsheets)\/d\/([\w-]+)/)))
    return { type:'drive', embed:'https://docs.google.com/' + m[1] + '/d/' + m[2] + (m[1]==='presentation' ? '/embed' : '/preview'), url:u };
  if(u.startsWith('data:image/') || /\.(png|jpe?g|gif|webp|svg)(\?|#|$)/i.test(u)) return { type:'image', embed:u, url:u };
  if(/\.pdf(\?|#|$)/i.test(u)) return { type:'pdf', embed:u, url:u };
  if(/\.(mp4|webm|ogg)(\?|#|$)/i.test(u)) return { type:'video', embed:u, url:u };
  return { type:'link', url:u };
}
const safeHref = u => /^https?:\/\//i.test(String(u||'')) ? String(u) : '#';
function mediaHtml(info){
  if(!info) return '';
  if(info.type==='youtube' || info.type==='drive')
    return `<div class="vwrap" style="border-radius:14px;overflow:hidden"><iframe src="${esc(info.embed)}" allowfullscreen loading="lazy" allow="autoplay; fullscreen"></iframe></div>`;
  if(info.type==='pdf')
    return `<iframe class="pv" src="${esc('https://docs.google.com/viewer?embedded=true&url=' + encodeURIComponent(info.url))}"></iframe>`;
  if(info.type==='pdfown') return `<iframe class="pv" src="${esc(info.embed)}"></iframe>`;
  if(info.type==='image') return `<img class="pv" src="${esc(info.embed)}" alt="">`;
  if(info.type==='video') return `<video controls preload="metadata" src="${esc(info.embed)}" style="width:100%;border-radius:14px"></video>`;
  return `<a class="btn" href="${esc(safeHref(info.url))}" target="_blank" rel="noopener noreferrer">${I('ext','s')} فتح الرابط</a>`;
}
function imgSrc(s){
  s = String(s || ''); if(!s) return '';
  if(s.startsWith('data:image/')) return s;
  if(/^https?:\/\//i.test(s)){ const inf = embedInfo(s); return (inf && inf.type==='drive' && inf.thumb) ? inf.thumb : s; }
  return pubUrl(s);
}
function resBlock(x){
  const out = [];
  if(x.attach_path){
    const n = (x.attach_name || '').toLowerCase(), u = pubUrl(x.attach_path);
    const body = /\.pdf$/.test(n) ? mediaHtml({ type:'pdfown', embed:u }) : /\.(png|jpe?g|gif|webp)$/.test(n) ? mediaHtml({ type:'image', embed:u }) : '';
    out.push(`<details class="res"><summary>${I('file','s')} ملف مرفق: <b dir="auto">${esc(x.attach_name || 'ملف')}</b></summary>${body}<div class="acts"><a class="btn sec" href="${esc(pubUrl(x.attach_path, x.attach_name))}">${I('download','s')} تحميل الملف</a></div></details>`);
  }
  if(x.ext_url){
    const inf = embedInfo(x.ext_url);
    const lbl = { youtube:'فيديو يوتيوب', drive:'ملف من جوجل درايف', image:'صورة', pdf:'ملف PDF', video:'فيديو', link:'رابط خارجي' }[inf.type];
    out.push(`<details class="res"><summary>${I('link','s')} ${lbl}</summary>${mediaHtml(inf)}<div class="acts"><a class="btn sec" href="${esc(safeHref(x.ext_url))}" target="_blank" rel="noopener noreferrer">${I('ext','s')} فتح في نافذة جديدة</a></div></details>`);
  }
  return out.join('');
}

/* ---- استيراد أسئلة من ملف JSON ---- */
function parseQuizJson(txt){
  let j = JSON.parse(txt);
  if(Array.isArray(j)) j = { questions:j };
  if(!j || !Array.isArray(j.questions)) throw new Error('لا توجد قائمة questions');
  const qs = j.questions.map((x, i) => {
    const q = String(x.q ?? x.question ?? '').trim();
    const options = (x.options ?? x.choices ?? []).map(o => String(o).trim()).filter(Boolean).slice(0, 6);
    const c = x.correct ?? x.answer;
    let idx = -1;
    if(typeof c === 'number') idx = c - 1;
    else if(typeof c === 'string'){
      const s = c.trim(), k = options.findIndex(o => o === s);
      if(k >= 0) idx = k;
      else if(/^\d+$/.test(s)) idx = parseInt(s, 10) - 1;
      else if(/^[A-Fa-f]$/.test(s)) idx = s.toUpperCase().charCodeAt(0) - 65;
    }
    if(!q) throw new Error('السؤال ' + (i+1) + ': نص السؤال فارغ');
    if(options.length < 2) throw new Error('السؤال ' + (i+1) + ': يحتاج خيارين على الأقل');
    if(idx < 0 || idx >= options.length) throw new Error('السؤال ' + (i+1) + ': الإجابة الصحيحة غير محددة');
    return { q, options, correct:idx, explain:String(x.explain ?? x.explanation ?? '').trim(), image:String(x.image ?? x.img ?? '').trim() };
  });
  if(!qs.length) throw new Error('لا توجد أسئلة في الملف');
  return { title:String(j.title || ''), level:String(j.level || ''), description:String(j.description || ''), time:parseInt(j.time_limit_min ?? j.time, 10) || 0, questions:qs };
}
async function importQuizJson(file){
  if(!file) return;
  try{
    const d = parseQuizJson(await file.text());
    if(d.title && !$('#z_title').value.trim()) $('#z_title').value = d.title;
    if(LEVELS.includes(d.level)) $('#z_level').value = d.level;
    if(d.description && !$('#z_desc').value.trim()) $('#z_desc').value = d.description;
    if(d.time > 0 && !$('#z_time').value) $('#z_time').value = d.time;
    $('#qlist').innerHTML = '';
    d.questions.forEach(q => addQBlock(q));
    toast('تم استيراد ' + d.questions.length + ' سؤال. راجعها ثم اضغط حفظ الاختبار', 'ok');
  }catch(err){ toast('ملف JSON غير صالح: ' + (err.message || ''), 'err'); }
}

/* ---- أدوات إنشاء الحسابات ---- */
const PW_CHARS = 'abcdefghjkmnpqrstuvwxyz23456789';
const rnd = n => crypto.getRandomValues(new Uint32Array(1))[0] % n;
const genPw = () => Array.from({length:7}, () => PW_CHARS[rnd(PW_CHARS.length)]).join('');
const takenLogins = () => new Set(students.map(s => String(s.login_id).toLowerCase()));
function genLogin(taken){
  for(let i=0;i<60;i++){ const u = 'fo' + (1000 + rnd(9000)); if(!taken.has(u)) return u; }
  return 'fo' + Date.now().toString(36);
}
const validLogin = v => v.includes('@') ? /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) : /^[a-z0-9._-]{3,30}$/.test(v);
function friendlyErr(err){
  const m = errMsg(err);
  if(err && err.code === 'confirm') return 'أوقف خيار "Confirm email" في Supabase أولاً (راجع التعليمات) ثم جرّب باسم دخول جديد';
  if(/already registered|already been registered|already exists|duplicate/i.test(m)) return 'اسم الدخول مستخدم من قبل';
  if(/rate limit|too many|429/i.test(m)) return 'تجاوزت الحد المسموح، انتظر 5 دقائق ثم أكمل';
  if(/invalid/i.test(m) && /email/i.test(m)) return 'اسم الدخول غير مقبول، جرّب اسماً آخر أو بريداً حقيقياً للطالب';
  if(/password/i.test(m)) return 'كلمة المرور غير مقبولة (6 أحرف على الأقل)';
  return m;
}

      <div class="actions"><button class="btn lg" id="bkbtn" type="submit">إنشاء الحسابات</button><button class="btn sec lg" type="button" data-a="close">إلغاء</button></div>

      else if(taken.has(login)) bad = 'اسم الدخول مكرر';
      else if(pw.length < 6) bad = 'كلمة المرور أقل من 6 أحرف';

      catch(err){
        r.err = friendlyErr(err);
        if(err && (err.code==='confirm' || /rate limit|too many|429/i.test(errMsg(err)))) stop = r.err;
      }
      done++; await new Promise(res=>setTimeout(res, 250));
    }
    await loadStudents(); render();
    credsModal(rows, `تم إنشاء ${rows.filter(r=>r.ok).length} من ${rows.length} حساب`);
  };

async function delStudent(id){
  const s = students.find(x=>x.id===id); if(!s) return;
  if(!confirm(`حذف حساب الطالب "${s.full_name}" نهائياً؟`)) return;
  const r = await sb.rpc('admin_delete_student', { p_user:id });
  if(r.error){ toast('تعذر الحذف: ' + errMsg(r.error), 'err'); return; }
  students = students.filter(x=>x.id!==id); render(); toast('تم حذف الحساب','ok');
}
document.addEventListener('change', async e => {
  const el = e.target;
  if(el.dataset && el.dataset.a === 'moveStudent'){
    const v = el.value || null;
    const { error } = await sb.from('profiles').update({ class_id:v }).eq('id', el.dataset.id);

});

/* ============ محرك الألعاب (منطق عام، البيانات في GAME_DATA) ============ */
const G = { view:'menu', game:null, level:null, qs:[], i:0, ok:0, pts:0, streak:0, maxStreak:0, pick:null, t0:0, t:0, snd:true, tot:0 };
try{ G.snd = localStorage.getItem('fo_snd') !== '0'; }catch(e){}
const GAME_ROUND = 8;
const shuf = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
let _ac = null;
function beep(kind){
  if(!G.snd) return;
  try{
    _ac = _ac || new (window.AudioContext || window.webkitAudioContext)();
    const seq = kind==='ok' ? [[660,0],[880,.11]] : kind==='bad' ? [[220,0],[160,.13]] : [[523,0],[659,.12],[784,.24]];
    seq.forEach(([f,d]) => { const o = _ac.createOscillator(), g = _ac.createGain(); o.type = kind==='bad'?'sawtooth':'sine'; o.frequency.value = f; g.gain.value = .08; o.connect(g); g.connect(_ac.destination); const s = _ac.currentTime + d; o.start(s); g.gain.exponentialRampToValueAtTime(.0001, s+.2); o.stop(s+.22); });
  }catch(e){}
}
const bestKey = () => 'fo_best_' + G.game + '_' + G.level;
const getBest = () => { try{ return +localStorage.getItem(bestKey()) || 0; }catch(e){ return 0; } };
const setBest = n => { try{ localStorage.setItem(bestKey(), String(n)); }catch(e){} };

function gameStart(level){
  const d = GAME_DATA[G.game], pool = d[level] || [];
  if(!pool.length) return;
  const qs = shuf(pool).slice(0, GAME_ROUND).map(q => {
    if(G.game==='mcq'){ const o = shuf(q.o.map((t,k)=>({t,k}))); return { q:q.q, o:o.map(x=>x.t), a:o.findIndex(x=>x.k===q.a), e:q.e }; }
    return { q:q.q, a:q.a?0:1, e:q.e };
  });
  Object.assign(G, { view:'play', level, qs, i:0, ok:0, pts:0, streak:0, maxStreak:0, pick:null, t0:Date.now(), t:0, tot:Date.now() });
  render(); window.scrollTo(0,0);
}
function gameAnswer(k){
  if(G.view!=='play' || G.pick!==null) return;
  k = +k; const q = G.qs[G.i]; if(!q || k<0 || k>=(G.game==='mcq'?q.o.length:2)) return;
  G.pick = k; G.t = (Date.now()-G.t0)/1000;
  if(k===q.a){ G.ok++; G.streak++; G.maxStreak = Math.max(G.maxStreak, G.streak); G.pts += 10 + (G.t<=5?5:0) + (G.streak>=3?5:0); beep('ok'); }
  else { G.streak = 0; beep('bad'); }
  render();
}
function gameNext(){
  if(G.view!=='play' || G.pick===null) return;
  if(G.i+1 >= G.qs.length){
    G.view = 'end'; G.tot = Math.round((Date.now()-G.tot)/1000);
    const b = getBest(); G.newBest = G.pts > b; if(G.newBest) setBest(G.pts);
    G.prevBest = b; if(G.ok === G.qs.length) beep('win');
  } else { G.i++; G.pick = null; G.t0 = Date.now(); }
  render(); window.scrollTo(0,0);
}
function renderGames(v){
  const snd = `<button class="gsnd" data-a="gSound" aria-label="الصوت">${G.snd?'🔊':'🔇'}</button>`;
  if(G.view==='menu'){
    v.innerHTML = `<h2 class="st"><span>${I('sparkle')} ألعاب تفاعلية <small>Jeux interactifs</small></span>${snd}</h2>
      <div class="grid">${Object.keys(GAME_DATA).map(k=>{ const d = GAME_DATA[k]; return `<button class="card gcard" data-a="gPick" data-id="${k}"><div class="ib ${d.col}">${I(d.ic)}</div><h3>${esc(d.title)}</h3><div class="meta" style="direction:ltr;text-align:right">${esc(d.fr)}</div><p>${esc(d.desc)}</p><span class="tag">${I('play','s')} ابدأ اللعب</span></button>`; }).join('')}</div>`;
    return;
  }
  const d = GAME_DATA[G.game];
  if(G.view==='level'){
    v.innerHTML = `<h2 class="st"><span>${esc(d.title)} <small>${esc(d.fr)}</small></span>${snd}</h2>
      <p class="gsub">اختر المستوى:</p>
      <div class="glv">${GAME_LEVELS.map(([c,n])=>{ G.level = c; const b = getBest(); return `<button class="glvb" data-a="gLvl" data-id="${c}"><b>${c}</b><span>${n}</span><small>${b?'أفضل نتيجة: '+b:'لم تلعب بعد'}</small></button>`; }).join('')}</div>
      <button class="chip" data-a="gMenu">← كل الألعاب</button>`;
    G.level = null; return;
  }
  if(G.view==='play'){
    const q = G.qs[G.i], n = G.qs.length, ans = G.pick!==null;
    let body;
    if(G.game==='mcq') body = `<div class="gopts">${q.o.map((t,k)=>`<button class="gopt ${ans?(k===q.a?'ok':k===G.pick?'bad':'dim'):''}" data-a="gAns" data-id="${k}" ${ans?'disabled':''}><i>${k+1}</i><span dir="auto">${esc(t)}</span></button>`).join('')}</div>`;
    else body = `<div class="gtf">${['صح ✓ Vrai','خطأ ✗ Faux'].map((t,k)=>`<button class="gopt ${ans?(k===q.a?'ok':k===G.pick?'bad':'dim'):''}" data-a="gAns" data-id="${k}" ${ans?'disabled':''}><i>${k+1}</i><span>${t}</span></button>`).join('')}</div>`;
    const fb = ans ? `<div class="gfb ${G.pick===q.a?'ok':'bad'}"><b>${G.pick===q.a?'أحسنت! 🎉':'ليست الإجابة الصحيحة'}</b><span>${esc(q.e||'')}</span></div><button class="gnext" data-a="gNext" autofocus>${G.i+1>=n?'عرض النتيجة':'السؤال التالي'} ←</button>` : '';
    v.innerHTML = `<div class="ghead"><span>${esc(d.title)} · ${G.level}</span><span>⭐ ${G.pts}</span>${G.streak>=2?`<span>🔥 ${G.streak}</span>`:''}${snd}</div>
      <div class="gbar"><i style="width:${(G.i+(ans?1:0))/n*100}%"></i></div>
      <div class="gq"><small>السؤال ${G.i+1} من ${n}</small><h3 dir="auto">${esc(q.q)}</h3></div>${body}${fb}
      <button class="chip" data-a="gMenu" style="margin-top:18px">إنهاء اللعبة</button>`;
    return;
  }
  if(G.view==='end'){
    const n = G.qs.length, pc = G.ok/n, st = pc===1?3:pc>=.7?2:pc>=.4?1:0;
    v.innerHTML = `<div class="gend"><div class="gstars">${[0,1,2].map(k=>k<st?'★':'☆').join('')}</div>
      <h2>${pc===1?'ممتاز! علامة كاملة':pc>=.7?'أحسنت!':pc>=.4?'جيد، حاول مرة أخرى':'لا بأس، التدريب يصنع الإتقان'}</h2>
      <div class="gstats"><div><b>${G.ok}/${n}</b><span>إجابات صحيحة</span></div><div><b>${G.pts}</b><span>النقاط</span></div><div><b>${G.maxStreak}</b><span>أطول سلسلة</span></div><div><b>${G.tot}ث</b><span>الوقت</span></div></div>
      ${G.newBest?`<p class="gnb">🏆 رقم قياسي جديد على هذا الجهاز!</p>`:G.prevBest?`<p class="gsub">أفضل نتيجة سابقة: ${G.prevBest}</p>`:''}
      <div class="gacts"><button class="gnext" data-a="gAgain">العب مرة أخرى</button><button class="chip" data-a="gLevels">تغيير المستوى</button><button class="chip" data-a="gMenu">كل الألعاب</button></div></div>`;
  }
}
const GH = {
  gPick:id=>{ if(!GAME_DATA[id]) return; G.game = id; G.view = 'level'; render(); },
  gLvl:id=>gameStart(id), gAns:id=>gameAnswer(id), gNext:gameNext,
  gAgain:()=>gameStart(G.level), gLevels:()=>{ G.view='level'; render(); },
  gMenu:()=>{ G.view='menu'; G.game=null; render(); },
  gSound:()=>{ G.snd = !G.snd; try{ localStorage.setItem('fo_snd', G.snd?'1':'0'); }catch(e){} render(); }
};
document.addEventListener('keydown', e => {
  if(state.tab!=='games' || G.view!=='play' || e.ctrlKey || e.metaKey || e.altKey) return;
  if(document.querySelector('#modal .ov') || /INPUT|TEXTAREA|SELECT/.test((e.target||{}).tagName||'')) return;
  if(/^[1-4]$/.test(e.key)) gameAnswer(+e.key-1);
  else if(e.key==='Enter' && G.pick!==null){ e.preventDefault(); gameNext(); }
});

const H = {
  ...GH,
  tab:id=>{ state.tab=id; state.level='all'; state.cat='all'; state.cls='all'; state.q=''; render(); window.scrollTo(0,0); },
  clsf:id=>{ state.cls=id; render(); },
  level:id=>{ state.level=id; render(); },
  cat:id=>{ state.cat=id; render(); },
  login, doLogin, logout, seed,
  addFile:()=>uploadForm('file'), addVideo:()=>uploadForm('video'),
  addQuiz:quizForm, addq:()=>addQBlock(), rmq:(id,el)=>{ el.closest('.qb').remove(); numberQs(); }, saveQuiz,
  addAssign:assignForm, addLink:linkForm,
  delItem, delQuiz, delAssign, delLink, delSub,
  takeQuiz, startQuiz, submitQuiz, results:showResults,
  openSubmit, subs:showSubs, saveGrade,
  preview, close:requestClose,
  addClass:addClassForm, delClass, addStudent:id=>addStudentForm(id), bulkStudents:id=>bulkForm(id),
  resetPw, doResetPw, delStudent, copyCreds, printCreds:()=>window.print(), myPw:changeMyPw, doMyPw,
  jsonSample:downloadSample, rvWrong:()=>setRv(true), rvAll:()=>setRv(false)
};
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-a]'); if(!el) return;
  if(el.tagName==='A') e.preventDefault();
  if(el.dataset.a==='ovclose'){ if(e.target===el) requestClose(); return; }
  if(el.dataset.a==='search') return;
  H[el.dataset.a]?.(el.dataset.id, el);
});
document.addEventListener('input', e=>{
  if(e.target.dataset?.a==='search'){
    state.q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const s = document.querySelector('[data-a=search]'); if(s){ s.focus(); s.setSelectionRange(pos,pos); }
  }
});

/* ============ البدء ============ */
(async function init(){
  if(!configured || !window.supabase){
    if(configured){ $('#view').innerHTML = `<div class="setup"><h2>تعذر تحميل مكتبة Supabase</h2><p style="color:var(--muted)">تأكد من اتصالك بالإنترنت ثم أعد تحميل الصفحة.</p></div>`; }
    else renderSetup();
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { global:{ fetch: safeFetch } });
  sb.auth.onAuthStateChange((ev, sess) => {
    setTimeout(() => {
      if(((sess && sess.user && sess.user.id) || null) !== state.uid) afterAuth();
    }, 0);
  });
  await afterAuth();
})();
</script>
